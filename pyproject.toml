[build-system]
requires      = ["setuptools>=69.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "hallsim"
dynamic         = ["version"]
description     = "Differentiable, composable multi-scale modelling framework for aging biology"
readme          = "README.md"
license         = {text = "MIT"}
authors         = [{name = "Baba Jaguska"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies    = [
  "numpy",
  "scipy",
  "pandas",
  "click",
  # Pin the minor: `uv run` syncs the environment to this file, so a stale
  # bound silently downgrades jaxlib out from under the CUDA plugin, which is
  # not declared here and so is not downgraded with it. The result is a PJRT
  # API mismatch at import. GPU support lives in the `cuda` extra below.
  "jax>=0.10,<0.11",
  "diffrax>=0.7,<0.8",
  "equinox>=0.13,<0.14",
  "optax>=0.2",
  "optimistix",
  "pint",
  "networkx",
  "sympy",
  "python-libsbml",
  "tqdm",
  "matplotlib",
  # Process pool with a per-task timeout; the corpus census kills and
  # respawns a worker stuck on one deposit instead of losing the run.
  "pebble",
]

[project.optional-dependencies]
search = ["pypdf>=5"]

# GPU execution. Kept out of the base dependencies so a CPU-only install stays
# small, but declared so `uv run`/`uv sync` do not strip the plugin: it must
# track jaxlib's version exactly or PJRT refuses to load it.
cuda = [
  "jax-cuda12-plugin[with-cuda]>=0.10,<0.11",
  "jax-cuda12-pjrt>=0.10,<0.11",
]

# Layered (Sugiyama) layout for the generated composite graph
# (hallsim.plotting.draw_composite_graph). A composite is a shallow DAG plus a
# few feedback edges, which a force layout renders as a ball; without this the
# drawer falls back to spring layout and says so.
graph = ["netgraph>=4.13"]

# `simulate view` and the hallmark-lever page: a Dash server with Plotly
# panels and a Cytoscape wiring graph. Interactive only, so it stays out of
# the base install.
app = ["dash>=2.17", "plotly>=5.22", "dash-cytoscape>=1.0"]

# COPASI's own bindings, used only to convert a .cps deposit to SBML on the
# way in (hallsim.cps_import). A paper's supplement is often a .cps rather
# than an SBML file, and COPASI exports SBML natively — reimplementing that
# translation would be reinventing a solved problem. Native wheel, so it is an
# extra rather than a base dependency; import fails with an install hint.
copasi = ["python-copasi>=4.42"]

# xlrd reads the legacy .xls a paper's deposited fitting data arrives as
# (DallePezze 2014's PottersWheel export); needed to verify a deposit against
# its own published fit — see hallsim.intake.published_fit_chi2.
dev = ["pytest", "black", "pre-commit", "flake8", "xlrd>=2.0"]

# The version is the git tag: `0.2.0` at tag `v0.2.0`, `0.2.1.devN+g<hash>`
# N commits past it (plus a date when the tree has uncommitted edits), so
# every build says where it sits between releases. Release by tagging:
# `git tag -a vX.Y.Z -m "..."` and push the tag; .github/workflows/release
# builds the wheel from it. An editable install fixes the version at
# install time, so `hallsim.io.versions` reads git beside it.
[tool.setuptools_scm]

[tool.setuptools.packages.find]
# `demos` ships too: the `simulate` entry point below imports it, so it cannot
# live outside the distribution. Include-filtered so nothing else at the repo
# root is picked up.
where   = ["src", "."]
include = ["hallsim*", "demos*"]

[tool.setuptools.package-data]
hallsim = [
  "py.typed",
  "reference/**/*.tsv",
  "reference/**/*.md",
  "view/*.css",
  "view/*.html",
  "view/*.js",
]
"demos.models" = ["sbml/**/*.xml"]
# The lever page's Dash assets (the institute wordmark).
demos = ["assets/*"]

[project.urls]
Repository    = "https://github.com/BabaJaguska/HallSim"
Documentation = "https://github.com/BabaJaguska/HallSim#readme"

[project.scripts]
simulate = "hallsim.cli:simulate"

[tool.black]
line-length = 79
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that take more than ~10s (typically multi-process Scheduler runs); deselect with '-m \"not slow\"'",
  "network: tests that need network access or un-bundled SBML downloads; deselected in CI via '-m \"not network\"'",
  "demo: tests bound to a specific biological demo model (eriq, saturating_removal, stem_cell_niche, multi_hallmark) rather than framework machinery; excluded from CI. Run with '-m demo' or 'make test-all'.",
]
