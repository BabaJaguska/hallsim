name: Release

# A pushed tag `vX.Y.Z` is a release: the suite must pass, then the wheel
# and the source distribution are built from that tag (setuptools-scm reads
# the version from it) and attached to a GitHub Release under the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: make install-dev

      - name: Run tests
        run: make test

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes

      - name: Keep the built files for the PyPI job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The same files go to PyPI through trusted publishing: PyPI accepts the
  # workflow's identity token instead of a stored secret, so the repository
  # holds no credential. The `pypi` environment is where PyPI expects the
  # token to come from; it is declared in the repository settings and on
  # PyPI as the pending publisher of the project.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Fetch the built files
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
